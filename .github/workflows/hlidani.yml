name: hlídání Timity

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_mail:
        description: "Poslat zkušební e-mail"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: hlidani
  cancel-in-progress: false

jobs:
  kontrola:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -I hlidej.py
        env:
          GH_TOKEN: ${{ github.token }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: dusan@timity.app
          TEST_MAIL: ${{ inputs.test_mail && '1' || '0' }}
